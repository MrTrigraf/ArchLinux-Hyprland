<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Шрифты Velora Arch.

  Правила только ослабляют выбор: alias/prefer и prepend с binding="weak".
  mode="assign" и binding="strong" не использовать: они перекрывают языковой fallback,
  и CJK-текст получает квадраты.

  Значки Nerd: Symbols Nerd Font добавлен в prefer для monospace и sans-serif.
  Алиас monospace на Symbols Nerd Font не задаётся: он сломал бы fc-match monospace.
-->
<fontconfig>

  <!-- Основные семейства -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- Явные семейства: Firefox не делает fallback на PUA-глифы.
       Список prefer помогает приложениям, которые берут готовый порядок fontconfig. -->
  <alias>
    <family>JetBrains Mono</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>Noto Sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>Noto Serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <!-- CJK, упрощённый китайский -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- CJK, традиционный китайский -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK TC</string></edit>
  </match>

  <!-- CJK, японский -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>

  <!-- CJK, корейский -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK KR</string></edit>
  </match>

  <!-- То же для serif -->
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK KR</string></edit>
  </match>

</fontconfig>
