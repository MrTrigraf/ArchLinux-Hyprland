# ~/.config/hypr/velora/hyprlock/hyprlockStart.conf
# Экран блокировки при входе в сессию (автозапуск в hyprland.lua).
# Синтаксис hyprlang (hyprlock НЕ использует Lua-конфиг).
#
# Цвета — $v_* из theme.colors, обои — $v_wallpaper из wallpaper.conf.
# Оба файла генерирует theme set. Относительный путь source hyprlock
# считает от папки этого файла.
source = theme.colors
source = wallpaper.conf

# ============================================================
# Общие параметры
# ============================================================
general {
    ignore_empty_input = true   # не аутентифицировать пустой ввод
    hide_cursor = false         # показывать курсор мыши (нужно для кликов по кнопкам)
    fail_timeout = 2000         # пауза (мс) после неверного пароля
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ============================================================
# Фон: обои текущей темы (ключ wallpaper в theme.conf)
# ============================================================
background {
    monitor =
    path = $v_wallpaper

    blur_passes = 0
    blur_size = 0
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ============================================================
# 1. Большие часы HH:MM — верхняя треть
#    Интересное: двоеточие окрашено в teal-акцент, цифры — fuji white.
# ============================================================
label {
    monitor =
    # Pango-разметка в cmd-выводе: двоеточие в акцентном цвете.
    text = cmd[update:1000] date +"%H<span foreground='$v_layout_hex'>:</span>%M"

    color = $v_fg
    font_size = 70
    font_family = JetBrainsMono Nerd Font ExtraBold

    halign = center
    valign = center
    position = 0, 400
}

# ============================================================
# 2. Поле ввода пароля — центр
# ============================================================
input-field {
    monitor =

    size = 220, 40
    halign = center
    valign = center
    position = 0, -170

    fade_on_empty = true
    fade_timeout = 1000

    outline_thickness = 3
    rounding = 45
    dots_size = 0.35
    dots_spacing = 0.30
    dots_center = true

    # Цвета (kanagawa-paper).
    inner_color = rgba(00000000)   # графит с прозрачностью
    font_color = $v_fg
    outer_color = $v_accent       # акцент темы — рамка по умолчанию
    check_color = $v_check        # во время проверки
    fail_color = $v_fail          # неверный пароль

    # Caps Lock: рамка становится золотой (акцент, не красный).
    capslock_color = $v_caps

    placeholder_text = <span foreground="$v_fg_subtle_hex">Пароль...</span>
    fail_text = <span foreground="$v_fail_hex">Ошибка</span>

    hide_input = false
}

# ============================================================
# 3. Дата: день месяц год — нижняя часть
#    Интересное: название месяца окрашено в золото.
# ============================================================
label {
    monitor =
    # Локаль ru_RU.UTF-8 → месяц по-русски; единый цвет.
    text = cmd[update:60000] date +"%d %B %Y"

    color = $v_fg
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = bottom
    position = 0, 120
}

# ============================================================
# 4. День недели — ниже и мельче даты
# ============================================================
label {
    monitor =
    text = cmd[update:60000] date +"%A"

    color = $v_fg_subtle
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = bottom
    position = 0, 80
}
# ============================================================
# 5. Раскладка EN/RU — на уровне дня недели
# ============================================================
label {
    monitor =
    text = $LAYOUT[EN,RU]

    color = $v_layout
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold

    halign = right
    valign = bottom
    position = -60, 70
}

# ============================================================
# 6. Кнопки питания — правый верхний угол
# ============================================================

# Спящий режим (suspend)
label {
    monitor =
    text = 󰤄
    onclick = systemctl suspend

    color = $v_caps
    font_size = 24
    font_family = JetBrainsMono Nerd Font

    halign = right
    valign = top
    position = -120, -20
}

# Перезагрузка (reboot)
label {
    monitor =
    text =󰑓
    onclick = systemctl reboot

    color = $v_layout
    font_size = 24
    font_family = JetBrainsMono Nerd Font Propo

    halign = right
    valign = top
    position = -70, -20
}

# Выключение (poweroff)
label {
    monitor =
    text = 󰐥
    onclick = systemctl poweroff

    color = $v_fail               # необратимое действие
    font_size = 24
    font_family = JetBrainsMono Nerd Font Propo

    halign = right
    valign = top
    position = -30, -20
}
