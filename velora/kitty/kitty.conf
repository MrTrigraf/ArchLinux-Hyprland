font_family      JetBrains Mono
font_size 12
symbol_map U+2600-U+26FF,U+2700-U+27BF,U+1F300-U+1FAFF Noto Color Emoji
window_padding_width 5
background_opacity 0.85
cursor_trail 1
confirm_os_window_close 0

# Цвета текущей темы. Относительный путь kitty считает от папки этого файла
# (man kitty.conf, include). themes/current — симлинк на папку темы.
include ../themes/current/theme.conf
