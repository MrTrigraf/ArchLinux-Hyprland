# hypridle — управление простоем и suspend
# Универсален для десктопа и ноутбука. Реакция на крышку ноута — через
# systemd-logind (дефолт HandleLidSwitch=suspend), здесь не настраивается.
# При закрытии крышки logind → suspend → hypridle ловит before_sleep_cmd.

general {
    # Команда блокировки. Защита `pidof hyprlock ||` против второго экземпляра
    # (кейбинд SUPER+SHIFT+L и сам hypridle могут одновременно вызывать lock).
    lock_cmd = pidof hyprlock || hyprlock --config $HOME/.config/hypr/kanagawa-paper/hypr/hyprlock.conf

    # Блокировать перед любым suspend: ручной systemctl suspend, listener suspend
    # ниже, закрытие крышки ноута. loginctl шлёт сигнал → hypridle вызывает lock_cmd.
    before_sleep_cmd = loginctl lock-session

    # Пробудить мониторы после resume — иначе клавишу пришлось бы давить дважды.
    # Hyprland 0.55+: новый Lua-синтаксис hyprctl dispatch.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# === ТАЙМИНГ 1/3: блокировка экрана ===
# Тест: 60 (1 мин). Продакшн обычно: 300-600 (5-10 мин).
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# === ТАЙМИНГ 2/3: выключение монитора (DPMS off) ===
# Тест: 120 (2 мин). Продакшн обычно: 600-900 (10-15 мин).
# Hyprland 0.55+: legacy `hyprctl dispatch dpms off` сломан, используется
# новый Lua-синтаксис через hl.dsp.dpms.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# === ТАЙМИНГ 3/3: уход в спящий режим (suspend) ===
# Тест: 180 (3 мин). Продакшн обычно: 1200-1800 (20-30 мин).
# После suspend сработает before_sleep_cmd (блокировка), при resume — after_sleep_cmd (dpms enable).
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
