# ~/.config/hypr/kanagawa-paper/hyprlock/hyprlock.conf
# Экран блокировки hyprlock. Тема kanagawa-paper (ink).
# Синтаксис hyprlang (hyprlock НЕ использует Lua-конфиг).
#
# Палитра (из fish-темы kanagawa-paper):
#   текст / fuji white      #DCD7BA   (normal)
#   акцент teal-blue        #698A9B   (command)
#   тёплое золото           #D4C196   (option)
#   вторичный тёплый серый  #ACA9A4   (param)
#   ошибка пыльная роза     #CC928E   (error)
#   проверка тёплый тан     #C4B28A   (quote)
#   графит фона поля        #363646   (selection)

# ============================================================
# Общие параметры
# ============================================================
general {
    ignore_empty_input = true   # не аутентифицировать пустой ввод
    hide_cursor = true          # скрывать курсор мыши
    fail_timeout = 2000         # пауза (мс) после неверного пароля
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ============================================================
# Фон: живой скриншот текущего экрана с размытием
# ============================================================
background {
    monitor =
    path = /home/barmaley/.config/hypr/kanagawa-paper/wallpaper/arch3.png

    blur_passes = 0
    blur_size = 0
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ============================================================
# 1. Большие часы HH:MM — верхняя треть
#    Интересное: двоеточие окрашено в teal-акцент, цифры — fuji white.
# ============================================================
label {
    monitor =
    # Pango-разметка в cmd-выводе: двоеточие в акцентном цвете.
    text = cmd[update:1000] date +"%H<span foreground='##698A9B'>:</span>%M"

    color = rgb(DCD7BA)            # fuji white (цифры)
    font_size = 70
    font_family = JetBrainsMono Nerd Font ExtraBold

    halign = center
    valign = center
    position = 0, 400
}

# ============================================================
# 2. Поле ввода пароля — центр
# ============================================================
input-field {
    monitor =

    size = 220, 40
    halign = center
    valign = center
    position = 0, -170

    fade_on_empty = true
    fade_timeout = 1000

    outline_thickness = 3
    rounding = 45
    dots_size = 0.35
    dots_spacing = 0.30
    dots_center = true

    # Цвета (kanagawa-paper).
    inner_color = rgba(00000000)   # графит с прозрачностью
    font_color = rgb(DCD7BA)       # fuji white
    outer_color = rgb(698A9B)      # teal-акцент — рамка по умолчанию
    check_color = rgb(C4B28A)      # тёплый тан — во время проверки
    fail_color = rgb(CC928E)       # пыльная роза — неверный пароль

    # Caps Lock: рамка становится золотой (акцент, не красный).
    capslock_color = rgb(D4C196)

    placeholder_text = <span foreground="##ACA9A4">Пароль...</span>
    fail_text = <span foreground="##CC928E">Ошибка</span>

    hide_input = false
}

# ============================================================
# 3. Дата: день месяц год — нижняя часть
#    Интересное: название месяца окрашено в золото.
# ============================================================
label {
    monitor =
    # Локаль ru_RU.UTF-8 → месяц по-русски; единый цвет.
    text = cmd[update:60000] date +"%d %B %Y"

    color = rgb(DCD7BA)            # fuji white
    font_size = 22
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = bottom
    position = 0, 120
}

# ============================================================
# 4. День недели — ниже и мельче даты
# ============================================================
label {
    monitor =
    text = cmd[update:60000] date +"%A"

    color = rgb(ACA9A4)            # тёплый серый (вторичный)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    halign = center
    valign = bottom
    position = 0, 80
}
# ============================================================
# 5. Раскладка EN/RU — на уровне дня недели
# ============================================================
label {
    monitor =
    text = $LAYOUT[EN,RU]

    color = rgb(698A9B)            # teal-акцент
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold

    halign = right
    valign = bottom
    position = -60, 70
}

